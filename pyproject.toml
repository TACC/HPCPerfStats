[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpcperfstats"
version = "3.0"
description = "A performance monitoring and analysis package for High Performance Computing Platforms"
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [
  { name = "Texas Advanced Computing Center", email = "sharrell@tacc.utexas.edu" },
]
urls = { homepage = "http://www.tacc.utexas.edu", repository = "https://github.com/TACC/hpcperfstats" }

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy==2.5.3",
  "numexpr==2.14.2",
  "psycopg==3.3.5",
  "pandas==3.0.5",
  "python-dateutil==2.9.0.post0",
  "bokeh==3.10.0",
  "Django>=6.1.1,<6.2",
  "python-hostlist==2.3.0",
  "pika==1.4.4",
  "mysqlclient==2.3.0",
  "gunicorn==26.2.0",
  "requests>=2.34.2",
  "cryptography>=50.0.1",
  "pillow>=12.3.0",
  "tzdata==2026.4",
  "redis==8.1.0",
  "djangorestframework==3.18.1",
  "drf-spectacular>=0.30.0",
  "django-cors-headers==4.9.0",
  "setproctitle==1.3.7",
  "brotli==1.2.0",
]

[project.optional-dependencies]
test = [
  "pytest>=9.1.1",
  "pytest-django>=4.14.0",
  "pytest-cov>=7.1.0",
  "playwright>=1.63.0",
  "psycopg[binary]==3.3.5",
]
dev = [
  "ruff>=0.16.8",
  "pylint>=4.0.8",  # optional; Ruff is the primary linter (see docs/TESTING.md)
  "vulture>=2.16",
  "pre-commit>=4.6.2",
  "memray>=1.20.0",  # commit-hook memory-leak smoke (scripts/run_commit_memory_leak_check.py)
]
# Docker image only: Intel MKL plus the build backends used to source-compile
# numpy/numexpr/pandas against it (--no-build-isolation). Never in
# project.dependencies -- no MKL wheels exist for macOS ARM, and the toolchain
# is not imported at runtime. Not installed by `pip install -e ".[test]"`.
# setuptools/wheel: required for numexpr's setuptools.build_meta when pip
# uses --no-build-isolation (official python images may omit setuptools).
# versioneer: pandas generate_version.py imports it during meson setup.
image-build = [
  "mkl==2026.1.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "mkl-devel==2026.1.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "meson-python==0.21.1",
  "meson==1.12.0",
  "ninja==1.13.2",
  "cython==3.3.0",
  "setuptools>=80",
  "wheel",
  "versioneer[toml]==0.29",
]

[tool.pytest.ini_options]
testpaths = ["hpcperfstats"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "hpcperfstats.site.hpcperfstats_site.settings"
django_find_project = false
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
markers = [
  "django: marks tests requiring Django (dbs, settings).",
  "machine_unit_mock: site.lib.machine.tests mocks only; no DB (see hpcperfstats/conftest.py).",
  "live_redis: live Redis cache integration; requires HPCPERFSTATS_PYTEST_LIVE_REDIS=1 and compose redis.",
    "stress_host_data: optional Timescale stress in tests/stress_host_data; requires HPCPERFSTATS_STRESS_HOST_DATA=1.",
    "pipeline_e2e: optional full-stack pipeline tests in tests/pipeline_e2e; requires HPCPERFSTATS_PIPELINE_E2E=1 and compose.",
]

[tool.setuptools]
script-files = [
  "hpcperfstats/analysis/metrics/update_metrics.py",
  "hpcperfstats/site/manage.py",
  "hpcperfstats/dbload/sync_acct.py",
  "hpcperfstats/dbload/sync_timedb.py",
  "hpcperfstats/dbload/sync_timedb_archive.py",
  "hpcperfstats/listend.py",
  "hpcperfstats/listend_drain.py",
  "scripts/invalidate_archive_members.py",
]

[tool.setuptools.packages.find]
include = ["hpcperfstats*"]
# Monorepo client package under hpcperfstats-tools/ must stay a separate
# distribution (import hpcperfstats_tools); do not absorb into hpcperfstats.
exclude = ["hpcperfstats_tools", "hpcperfstats_tools.*"]

[tool.setuptools.package-data]
hpcperfstats = [
  "tests/fixtures/axe-core/axe.min.js",
  "tests/fixtures/axe-core/README.md",
]
"hpcperfstats.dbload.lib.monitor_naming" = [
  "monitor_variable_rename_map.yaml",
]
"hpcperfstats.site.hpcperfstats_site" = [
  "static/**/*",
]

[tool.ruff]
target-version = "py314"
line-length = 80  # Google style guide (line length)
indent-width = 2  # workspace Python indent (2 spaces, not 4)
extend-exclude = [
  "migrations",
  ".venv",
  "env",
  ".git",
  "__pycache__",
  ".ruff*",
  ".tools",
  "build",
  "dist",
]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort (replaces pre-commit isort hook)
  "W",  # pycodestyle warnings (W291/W292/W293: trailing ws, EOF newline)
  "B",  # flake8-bugbear
  "UP",  # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # Ruff-specific
  "C4",  # flake8-comprehensions
  "PIE",  # flake8-pie
  "PGH",  # pygrep-hooks
]
ignore = [
  "E501",  # line length; ruff format wraps (Google 80 col)
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["hpcperfstats"]
combine-as-imports = true

# BLAS/configure_* / Django bootstrap before heavy imports (intentional E402).
[tool.ruff.lint.per-file-ignores]
"hpcperfstats/analysis/metrics/update_metrics.py" = [
  "E402",
  "B023",
  "SIM117",
  "SIM102",
  "B904",
]
"hpcperfstats/analysis/metrics/lib/plot/__init__.py" = ["E402"]
"hpcperfstats/analysis/metrics/lib/plot/devplot.py" = ["E402", "B007"]
"hpcperfstats/analysis/metrics/lib/plot/summaryplot.py" = ["E402", "B007"]
"hpcperfstats/analysis/metrics/tests/test_per_interval_rate.py" = ["E402"]
"hpcperfstats/analysis/metrics/tests/test_time_imbalance.py" = ["E402"]
# sync_timedb*: skip SIM/E731 refactors that introduce nested defs (python_def_inventory gate).
"hpcperfstats/dbload/lib/sync_timedb_archive_helpers.py" = [
  "E731",
  "SIM102",
  "SIM108",
  "SIM117",
  "B023",
  "B904",
  "RUF002",
  "RUF003",
  "SIM115",
  "SIM105",
]
"hpcperfstats/dbload/sync_timedb.py" = [
  "E402",
  "E731",
  "SIM102",
  "SIM108",
  "SIM117",
  "B023",
  "B904",
  "SIM115",
  "B039",
]
"hpcperfstats/dbload/sync_timedb_archive.py" = ["E402"]
"hpcperfstats/dbload/lib/sync_timedb_parsing.py" = ["B023", "SIM115", "B039", "E741"]
"hpcperfstats/dbload/lib/sync_timedb_queue_orchestrator.py" = [
  "B023",
  "SIM117",
  "SIM102",
  "B904",
]
"hpcperfstats/dbload/lib/sync_timedb_archive_members_coord.py" = ["B023", "SIM117"]
"hpcperfstats/dbload/lib/sync_timedb_day_raw_removal.py" = ["E402", "SIM117", "B904", "SIM102"]
"hpcperfstats/dbload/lib/sync_timedb_ingest_timeout.py" = ["E402"]
"hpcperfstats/dbload/lib/sync_timedb_startup_archive_scan.py" = ["E402"]
"hpcperfstats/dbload/sync_acct.py" = ["E402", "SIM117"]
"hpcperfstats/dbload/lib/multiprocessing_pool_health.py" = ["B904", "SIM102"]
"hpcperfstats/dbload/lib/file_locking.py" = ["SIM115"]
"hpcperfstats/dbload/lib/listend_db_ingest.py" = ["RUF003"]
"hpcperfstats/dbload/lib/print_utils.py" = ["SIM102"]
"hpcperfstats/dbload/lib/monitor_naming/load_map.py" = ["PGH003"]
"hpcperfstats/dbload/lib/conf_parser.py" = ["SIM117"]
"hpcperfstats/dbload/lib/sync_timedb_archive_maint.py" = ["SIM102"]
"hpcperfstats/dbload/lib/sync_timedb_job_discover.py" = ["SIM102"]
"hpcperfstats/dbload/lib/sync_timedb_stats_find.py" = ["SIM115"]
"hpcperfstats/listend.py" = ["SIM117", "SIM115"]
"hpcperfstats/analysis/metrics/lib/metrics.py" = ["B904"]
"hpcperfstats/analysis/metrics/lib/gen/jid_table.py" = ["B023"]
"hpcperfstats/site/lib/machine/api.py" = ["E402", "SIM117", "B904", "SIM105", "PGH003", "E741"]
"hpcperfstats/site/lib/machine/job_plot_artifacts.py" = ["SIM105"]
"hpcperfstats/site/lib/machine/oauth2.py" = ["SIM102"]
"hpcperfstats/site/lib/machine/throttles.py" = ["B904"]
"hpcperfstats-tools/hpcperfstats_tools/api_key_cache.py" = ["SIM105"]
"scripts/python_def_inventory.py" = ["E741", "B023", "SIM102"]
"scripts/pg18_host_data_chunk_copy.py" = ["SIM117"]
"hpcperfstats/site/hpcperfstats_site/settings.py" = ["E402"]
"hpcperfstats/site/lib/machine/update_xalt.py" = ["E402"]
"hpcperfstats/site/lib/machine/tests/test_jid_table.py" = ["E402"]
"hpcperfstats-tools/hpcperfstats_tools/config.py" = ["E402"]
"cursor-hooks/**" = ["E402"]
"hpcperfstats/analysis/metrics/lib/gen/utils.py" = ["E402"]
"hpcperfstats/tests/test_cursor_hooks.py" = ["E402"]
"scripts/python_def_docstring_upgrade.py" = ["E402", "SIM102"]
"scripts/restore_docstring_prose_from_git.py" = ["E402"]
# Django Meta / DRF ``fields`` / ``indexes`` lists are class-scoped config, not instances.
"hpcperfstats/site/lib/machine/models.py" = ["RUF012"]
"hpcperfstats/site/lib/machine/serializers.py" = ["RUF012"]
"hpcperfstats/site/lib/machine/public_api.py" = ["RUF012"]
"hpcperfstats/site/hpcperfstats_site/staticfiles_config.py" = ["RUF012"]
# Test doubles: mutable class attrs; pragmatic lint debt on large archive/metrics tests.
"**/tests/**" = [
  "RUF012",
  "SIM115",
  "E741",
  "RUF043",
  "UP045",
  "B023",
  "SIM117",
  "SIM102",
  "B904",
  "RUF003",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.hpcperfstats.testing]
web_e2e_runner = "tests/run_web_e2e_workflow.sh"
db_pytest_runner = "tests/run_db_pytest_workflow.sh"
redis_cache_pytest_runner = "tests/run_redis_cache_pytest_workflow.sh"

[tool.coverage.run]
branch = true
source = ["hpcperfstats"]
omit = [
  "*/migrations/*",
  "*/tests/*",
  "*/test_*.py",
  "*/conftest.py",
]

[tool.coverage.report]
skip_empty = true
show_missing = true
precision = 1
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.vulture]
paths = ["hpcperfstats"]
min_confidence = 80
ignore_decorators = [
  "@receiver",
  "@pytest.fixture",
  "@api_view",
  "@authentication_classes",
  "@contextmanager",
]
ignore_names = [
  "urlpatterns",
  "ready",
  "Meta",
  "handle",
  "add_arguments",
]
