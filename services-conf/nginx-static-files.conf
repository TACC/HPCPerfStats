# Browsers request /favicon.ico by default; answer at the edge so Gunicorn is not involved.
# Replace with try_files to a real file under /srv/static when a favicon is added.
location = /favicon.ico {
    access_log off;
    return 404;
}

location /static/ {
    alias /srv/static/;
    try_files $uri =404;
    access_log off;
    log_not_found off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
}

location /media/ {
    alias /srv/media/;
    try_files $uri =404;
    log_not_found off;
    expires off;
    add_header Cache-Control "public, max-age=0";
}

# Serve the React SPA shell from nginx in production.
# Keep shell uncached so hashed bundle references do not go stale.
location = /machine {
    return 302 /machine/;
}

location ^~ /machine/ {
    root /srv/static;
    try_files /frontend/index.html =503;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
}

location = /pub {
    return 302 /pub/;
}

location ^~ /pub/ {
    root /srv/static;
    try_files /frontend/index.html =503;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
}

# Django (Gunicorn): explicit prefixes only (see hpcperfstats_site/urls.py).
# Unknown paths stop here with 404 so probes never reach the app server.
location = / {
    include /etc/nginx/nginx-django-proxy-common.inc;
    proxy_pass http://django_server;
}

