# Cap RabbitMQ's own memory alarm below the compose cgroup so publishers block
# before Erlang binary_alloc hits the hard wall. Pair with compose
# mem_limit/memswap_limit 96g on the rabbitmq service (watermark must stay
# strictly below that limit). Recreate the rabbitmq service after changing
# this file or the compose limits. On hosts with less than 96 GiB RAM, lower
# mem_limit and this absolute watermark together.
vm_memory_high_watermark.absolute = 80GiB
