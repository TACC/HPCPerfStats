name: Monitor verify

on:
  push:
    paths:
      - 'monitor/**'
      - 'docs/monitor_variable_rename_map.yaml'
      - '.github/workflows/monitor-verify.yaml'
  pull_request:
    paths:
      - 'monitor/**'
      - 'docs/monitor_variable_rename_map.yaml'
      - '.github/workflows/monitor-verify.yaml'

jobs:
  static-bundle-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config make gcc g++ \
            python3 curl cmake gzip \
            librabbitmq-dev libev-dev \
            qemu-user-static

      - name: Static bundle build
        working-directory: monitor
        run: ./scripts/build_static_bundle.sh

      - name: Unit tests (make check)
        working-directory: monitor/.build-static
        run: make check

      - name: distclean static build tree
        working-directory: monitor/.build-static
        run: make distclean

  cross-compile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config make gcc g++ \
            python3 curl cmake gzip \
            librabbitmq-dev libev-dev \
            qemu-user-static \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Foreign cross-compile smoke
        working-directory: monitor
        env:
          TARGETS: aarch64-linux-gnu
        run: ./scripts/cross_compile_test.sh --force-foreign --fail-fast
