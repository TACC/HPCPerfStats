# Local git hooks for lint gates (install: scripts/install-git-hooks.sh).
default_language_version:
  python: python3.14

repos:
  - repo: local
    hooks:
      - id: python-def-inventory-check
        name: python def docstring/hint inventory (--check)
        entry: bash -c '../.venv/bin/python3 scripts/python_def_inventory.py --check'
        language: system
        files: ^(hpcperfstats/|scripts/|services-conf/).*\.py$
        pass_filenames: false

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (staged Python, pyproject policy)
        entry: bash -c '../.venv/bin/ruff check --fix "$@"' --
        language: system
        files: ^(hpcperfstats/|cursor-hooks/|scripts/|services-conf/|hpcperfstats-tools/).*\.py$
        exclude: (^|/)migrations/
        pass_filenames: true

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (staged Python)
        entry: bash -c '../.venv/bin/ruff format "$@"' --
        language: system
        files: ^(hpcperfstats/|cursor-hooks/|scripts/|services-conf/|hpcperfstats-tools/).*\.py$
        exclude: (^|/)migrations/
        pass_filenames: true

  - repo: local
    hooks:
      - id: frontend-eslint
        name: frontend eslint (staged)
        # GUI git / Cursor often omit Homebrew from PATH; prefer explicit npm.
        entry: >-
          bash -c 'export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH";
          cd hpcperfstats/site/frontend && npm run lint -- --max-warnings=0'
        language: system
        files: ^hpcperfstats/site/frontend/.*\.(ts|tsx)$
        pass_filenames: false

  - repo: local
    hooks:
      - id: python-memory-leak-check
        name: python memory-leak smoke (memray curated workloads)
        entry: ../.venv/bin/python3 scripts/run_commit_memory_leak_check.py
        language: system
        files: ^(hpcperfstats/|scripts/).*\.py$
        pass_filenames: false

  - repo: local
    hooks:
      - id: frontend-pre-push
        name: frontend typecheck + knip (pre-push)
        entry: >-
          bash -c 'export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH";
          cd hpcperfstats/site/frontend && npm run typecheck && npm run lint:dead'
        language: system
        stages: [pre-push]
        pass_filenames: false

  - repo: local
    hooks:
      - id: vulture-pre-push
        name: vulture dead code (pre-push)
        entry: bash -c '../.venv/bin/vulture hpcperfstats scripts/vulture_whitelist.py --min-confidence 80'
        language: system
        stages: [pre-push]
        pass_filenames: false
