upstream hpcperfstats {
    server web:8000;
}


server {
    listen 80;    
        
    # Security headers:
    # Keep headers that Django already sets (X-Frame-Options, nosniff, Referrer-Policy)
    # in one place (Django SecurityMiddleware) to avoid duplicates and conflicts.
    # Only set headers here that Django doesn't emit by default.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    client_max_body_size 14M;
    location / {
        proxy_pass http://web:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    } 
}   
    
