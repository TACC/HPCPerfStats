[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpcperfstats"
version = "3.0"
description = "A performance monitoring and analysis package for High Performance Computing Platforms"
readme = "README.md"
requires-python = ">=3.14"
license = "LGPL-2.1-only"
license-files = ["LICENSE"]
authors = [
  { name = "Texas Advanced Computing Center", email = "sharrell@tacc.utexas.edu" },
]
urls = { homepage = "http://www.tacc.utexas.edu", repository = "https://github.com/TACC/hpcperfstats" }

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy==2.5.5",
  "numexpr==2.14.2",
  "psycopg==3.3.9",
  "pandas==3.1.1",
  "python-dateutil==4.0.0",
  "bokeh==3.10.2",
  "Django>=6.1.3,<6.2",
  "python-hostlist==2.3.0",
  "pika==1.5.0",
  "mysqlclient==2.3.2",
  "gunicorn==27.0.1",
  "requests>=2.34.2",
  "cryptography>=50.0.2",
  "pillow>=13.0.0",
  "tzdata==2026.6",
  "django-valkey==0.5.0",
  "valkey==6.2.0",
  "djangorestframework==3.18.3",
  "drf-spectacular>=0.30.0",
  "django-cors-headers==4.9.0",
  "setproctitle==1.3.8",
  "brotli==1.2.1",
]

[project.optional-dependencies]
test = [
  "pytest>=9.2.0",
  "pytest-django>=4.14.0",
  "pytest-cov>=7.1.0",
  "playwright>=1.65.2",
  "psycopg[binary]==3.3.9",
]
dev = [
  "ruff>=0.17.6",
  # pylint is optional; Ruff is the primary linter
  # (see docs/how-to/develop/run-tests.md).
  "pylint>=4.1.4",
  "vulture>=2.16",
  "pre-commit>=4.7.0",
  "memray>=1.20.0",  # commit-hook memory-leak smoke (scripts/run_commit_memory_leak_check.py)
  # Markdown lint hooks (.pre-commit-config.yaml; docs/reference/documentation-style.md).
  # vale is the pip wrapper: its first run downloads the Vale binary from GitHub.
  "mdformat==0.7.22",
  "mdformat-gfm==1.0.0",
  "mdformat-gfm-alerts==2.1.0",
  "mdformat-tables==1.0.0",
  "pymarkdownlnt==0.9.42",
  "vale==3.28.1.0",
  "codespell==2.4.3",
]
# Docker image only: Intel MKL plus the build backends used to source-compile
# numpy/numexpr/pandas against it (--no-build-isolation). Never in
# project.dependencies -- no MKL wheels exist for macOS ARM, and the toolchain
# is not imported at runtime. Not installed by `pip install -e ".[test]"`.
# setuptools/wheel: required for numexpr's setuptools.build_meta when pip
# uses --no-build-isolation (official python images may omit setuptools).
# versioneer: pandas generate_version.py imports it during meson setup.
image-build = [
  "mkl==2026.2.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "mkl-devel==2026.2.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "meson-python==0.22.1",
  "meson==1.12.1",
  "ninja==1.13.2",
  "cython==3.3.2",
  "setuptools>=80",
  "wheel",
  "versioneer[toml]==0.29",
]

[tool.pytest.ini_options]
testpaths = ["hpcperfstats"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "hpcperfstats.site.hpcperfstats_site.settings"
django_find_project = false
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
markers = [
  "django: marks tests requiring Django (dbs, settings).",
  "machine_unit_mock: site.lib.machine.tests mocks only; no DB (see hpcperfstats/conftest.py).",
  "compose_db: needs the default PostgreSQL DB; set by hpcperfstats/conftest.py, deselected by scripts/run_tests.py --no-django.",
  "live_valkey: live Valkey cache integration; requires HPCPERFSTATS_PYTEST_LIVE_VALKEY=1 and compose valkey.",
    "stress_host_data: optional Timescale stress in tests/stress_host_data; requires HPCPERFSTATS_STRESS_HOST_DATA=1.",
    "pipeline_e2e: optional full-stack pipeline tests in tests/pipeline_e2e; requires HPCPERFSTATS_PIPELINE_E2E=1 and compose.",
]

[tool.setuptools]
script-files = [
  "hpcperfstats/analysis/metrics/update_metrics.py",
  "hpcperfstats/site/manage.py",
  "hpcperfstats/dbload/sync_acct.py",
  "hpcperfstats/dbload/sync_timedb.py",
  "hpcperfstats/dbload/sync_timedb_archive.py",
  "hpcperfstats/listend.py",
  "hpcperfstats/listend_drain.py",
  "scripts/invalidate_archive_members.py",
]

[tool.setuptools.packages.find]
include = ["hpcperfstats*"]
# Monorepo client package under hpcperfstats-tools/ must stay a separate
# distribution (import hpcperfstats_tools); do not absorb into hpcperfstats.
exclude = ["hpcperfstats_tools", "hpcperfstats_tools.*"]

[tool.setuptools.package-data]
hpcperfstats = [
  "tests/fixtures/axe-core/axe.min.js",
  "tests/fixtures/axe-core/README.md",
]
"hpcperfstats.dbload.lib.monitor_naming" = [
  "monitor_variable_rename_map.yaml",
]
"hpcperfstats.site.hpcperfstats_site" = [
  "static/**/*",
]

[tool.ruff]
target-version = "py314"
line-length = 80  # Google style guide (line length)
indent-width = 2  # workspace Python indent (2 spaces, not 4)
extend-exclude = [
  "migrations",
  ".venv",
  "env",
  ".git",
  "__pycache__",
  ".ruff*",
  ".tools",
  "build",
  "dist",
]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort (replaces pre-commit isort hook)
  "W",  # pycodestyle warnings (W291/W292/W293: trailing ws, EOF newline)
  "B",  # flake8-bugbear
  "UP",  # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # Ruff-specific
  "C4",  # flake8-comprehensions
  "PIE",  # flake8-pie
  "PGH",  # pygrep-hooks
  "S",  # flake8-bandit (security)
]
ignore = [
  "E501",  # line length: ``ruff format --check`` (line-length = 80)
  "S603",  # subprocess argv lists (ingest, operator scripts)
  "S607",  # partial paths for zstd/tar/psql on PATH
  "S108",  # /tmp under operator-controlled archive paths
  "S110",  # try-except-pass best-effort (track in security backlog)
  "S112",  # try-except-continue in poll loops
  "S608",  # dynamic SQL identifiers; values use driver placeholders
  "S105",  # false positives on day_token / cache token variable names
  "S606",  # subprocess without shell (operator scripts)
  "S310",  # internal amqp/http/file URLs in daemons and E2E helpers
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["hpcperfstats"]
combine-as-imports = true

# BLAS/configure_* / Django bootstrap before heavy imports (intentional E402).
[tool.ruff.lint.per-file-ignores]
"hpcperfstats/analysis/metrics/update_metrics.py" = [
  "E402",
  "SIM117",
  "SIM102",
]
"hpcperfstats/analysis/metrics/lib/plot/__init__.py" = ["E402"]
"hpcperfstats/analysis/metrics/lib/plot/devplot.py" = ["E402", "B007"]
"hpcperfstats/analysis/metrics/lib/plot/summaryplot.py" = ["E402", "B007"]
"hpcperfstats/analysis/metrics/tests/test_per_interval_rate.py" = ["E402"]
"hpcperfstats/analysis/metrics/tests/test_time_imbalance.py" = ["E402"]
# sync_timedb*: skip SIM/E731 refactors that introduce nested defs (python_def_inventory gate).
"hpcperfstats/dbload/lib/sync_timedb_archive_helpers.py" = [
  "E731",
  "SIM102",
  "SIM108",
  "SIM117",
  "B023",
  "RUF002",
  "RUF003",
  "SIM115",
  "SIM105",
]
"hpcperfstats/dbload/sync_timedb.py" = [
  "E402",
  "E731",
  "SIM102",
  "SIM108",
  "SIM117",
  "B023",
  "SIM115",
]
"hpcperfstats/dbload/sync_timedb_archive.py" = ["E402"]
"hpcperfstats/dbload/lib/sync_timedb_parsing.py" = ["B023", "SIM115", "E741"]
# Codon-only C ABI (``Ptr`` / ``cobj`` / ``@export``); not importable under CPython.
"hpcperfstats/dbload/codon/feed_collapse_capi.py" = ["F821"]
"hpcperfstats/dbload/lib/sync_timedb_queue_orchestrator.py" = [
  "SIM117",
  "SIM102",
]
"hpcperfstats/dbload/lib/sync_timedb_archive_members_coord.py" = ["SIM117"]
"hpcperfstats/dbload/lib/sync_timedb_day_raw_removal.py" = ["E402", "SIM117", "SIM102"]
"hpcperfstats/dbload/lib/sync_timedb_ingest_timeout.py" = ["E402"]
"hpcperfstats/dbload/lib/sync_timedb_startup_archive_scan.py" = ["E402"]
"hpcperfstats/dbload/sync_acct.py" = ["E402", "SIM117"]
"hpcperfstats/dbload/lib/multiprocessing_pool_health.py" = ["SIM102"]
"hpcperfstats/dbload/lib/file_locking.py" = ["SIM115"]
"hpcperfstats/dbload/lib/listend_db_ingest.py" = ["RUF003"]
"hpcperfstats/dbload/lib/print_utils.py" = ["SIM102"]
"hpcperfstats/dbload/lib/monitor_naming/load_map.py" = ["PGH003"]
"hpcperfstats/dbload/lib/sync_timedb_archive_maint.py" = ["SIM102"]
"hpcperfstats/dbload/lib/sync_timedb_job_discover.py" = ["SIM102"]
"hpcperfstats/dbload/lib/sync_timedb_stats_find.py" = ["SIM115"]
"hpcperfstats/listend.py" = ["SIM117", "SIM115"]
"hpcperfstats/site/lib/machine/job_plot_artifacts.py" = ["SIM105"]
"hpcperfstats-tools/hpcperfstats_tools/api_key_cache.py" = ["SIM105"]
"hpcperfstats/site/lib/machine/api.py" = ["E402", "PGH003", "E741"]
"scripts/python_def_inventory.py" = ["E741"]
"scripts/python_def_docstring_upgrade.py" = ["E402"]
"scripts/restore_docstring_prose_from_git.py" = ["E402"]
"hpcperfstats/site/hpcperfstats_site/settings.py" = ["E402"]
"hpcperfstats/site/lib/machine/update_xalt.py" = ["E402"]
"hpcperfstats/site/lib/machine/tests/test_jid_table.py" = ["E402"]
"hpcperfstats-tools/hpcperfstats_tools/config.py" = ["E402"]
"hpcperfstats-tools/tests/**" = ["S101", "S105", "S106"]
"cursor-hooks/**" = ["E402", "S101"]
"hpcperfstats/analysis/metrics/lib/gen/utils.py" = ["E402"]
"hpcperfstats/tests/test_cursor_hooks.py" = ["E402"]
"hpcperfstats/site/lib/machine/models.py" = ["RUF012"]
"hpcperfstats/site/lib/machine/serializers.py" = ["RUF012"]
"hpcperfstats/site/lib/machine/public_api.py" = ["RUF012"]
"hpcperfstats/site/hpcperfstats_site/staticfiles_config.py" = ["RUF012"]
# Test doubles: mutable class attrs; pragmatic lint debt on large archive/metrics tests.
"**/tests/**" = [
  "RUF012",
  "SIM115",
  "SIM117",
  "SIM102",
  "E741",
  "RUF043",
  "UP045",
  "RUF003",
  "S101",  # pytest asserts
  "S105",  # test fixture secrets / dummy tokens
  "S106",  # test credential placeholders
  "S107",
  "S103",
  "S102",
]
"scripts/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.hpcperfstats.testing]
web_e2e_runner = "tests/run_web_e2e_workflow.sh"
db_pytest_runner = "tests/run_db_pytest_workflow.sh"
valkey_cache_pytest_runner = "tests/run_valkey_cache_pytest_workflow.sh"

[tool.coverage.run]
branch = true
source = ["hpcperfstats"]
omit = [
  "*/migrations/*",
  "*/tests/*",
  "*/test_*.py",
  "*/conftest.py",
]

[tool.coverage.report]
skip_empty = true
show_missing = true
precision = 1
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.vulture]
paths = ["hpcperfstats"]
min_confidence = 80
ignore_decorators = [
  "@receiver",
  "@pytest.fixture",
  "@api_view",
  "@authentication_classes",
  "@contextmanager",
]
ignore_names = [
  "urlpatterns",
  "ready",
  "Meta",
  "handle",
  "add_arguments",
]
