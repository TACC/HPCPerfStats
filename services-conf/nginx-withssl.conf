upstream django_server {
    server web:8000;
}

server {
    listen 80;

    #redirect all HTTP links to the matching HTTPS page
    return 301 https://$host$request_uri;
}

server {
        listen 443 ssl;

        server_tokens off;

        # Security headers:
        # Keep headers that Django already sets (HSTS, X-Frame-Options, nosniff, Referrer-Policy)
        # in one place (Django SecurityMiddleware) to avoid duplicates and conflicts.
        # Only set headers here that Django doesn't emit by default.
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        # Allow large sacct ingest payloads from hpcperfstats-sacct-gen.
        # Default nginx limits are too small for full-day accounting output.
        # This applies to all HTTPS requests for simplicity, but the primary
        # consumer is /api/sacct/ingest/.
        client_max_body_size 64M;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_ciphers ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-CCM:DHE-RSA-AES256-CCM8:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-CCM:DHE-RSA-AES128-CCM8:DHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256;

        # Perfect Forward Secrecy(PFS) is frequently compromised without this
        ssl_prefer_server_ciphers on;


        ssl_certificate /etc/letsencrypt/live/stats.stampede3.tacc.utexas.edu/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/stats.stampede3.tacc.utexas.edu/privkey.pem;

        location / {
            proxy_pass         http://web:8000;
            proxy_redirect     off;
            proxy_http_version 1.1;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host nginx;
            proxy_set_header   X-Forwarded-Port $server_port;
            proxy_buffer_size           128k;
            proxy_buffers               4 256k;
            proxy_busy_buffers_size     256k;

            # extend the timeout for long-loading pages
            proxy_connect_timeout       600;
            proxy_send_timeout          600;
            proxy_read_timeout          600;
            send_timeout                600;

        }
}
