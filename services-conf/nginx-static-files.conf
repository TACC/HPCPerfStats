location /static/ {
    alias /srv/static/;
    try_files $uri =404;
    access_log off;
    log_not_found off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
}

location /media/ {
    alias /srv/media/;
    try_files $uri =404;
    log_not_found off;
    expires off;
    add_header Cache-Control "public, max-age=0";
}

# Serve the React SPA shell from nginx in production.
# Keep shell uncached so hashed bundle references do not go stale.
location = /machine {
    return 302 /machine/;
}

location ^~ /machine/ {
    root /srv/static;
    try_files /frontend/index.html =503;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
}
