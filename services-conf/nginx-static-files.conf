# Browsers request /favicon.ico by default; answer at the edge so Gunicorn is not involved.
# Replace with try_files to a real file under /srv/static when a favicon is added.
location = /favicon.ico {
    access_log off;
    include /etc/nginx/nginx-edge-security-headers.inc;
    include /etc/nginx/nginx-csp-no-active.inc;
    return 404;
}

location /static/ {
    alias /srv/static/;
    try_files $uri =404;
    access_log off;
    log_not_found off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    include /etc/nginx/nginx-edge-security-headers.inc;
    include /etc/nginx/nginx-csp-no-active.inc;
}

# Defense in depth: never HTTP-serve config/docs/source-map leftovers from STATIC_ROOT
# (proxy_entrypoint strips these from frontend/; collectstatic/heal may reintroduce handoff files).
location ~* ^/static/.*\.(inc|md|markdown|map|example|sh|py|toml|ini|ya?ml)$ {
    access_log off;
    log_not_found off;
    include /etc/nginx/nginx-edge-security-headers.inc;
    include /etc/nginx/nginx-csp-no-active.inc;
    return 404;
}

location /media/ {
    alias /srv/media/;
    try_files $uri =404;
    log_not_found off;
    expires off;
    add_header Cache-Control "public, max-age=0";
    include /etc/nginx/nginx-edge-security-headers.inc;
    include /etc/nginx/nginx-csp-no-active.inc;
}

# Serve Next.js static export shells from nginx in production.
# Hashed assets live under /static/frontend/_next/ (Next assetPrefix).
# Deep links fall back to segment index.html; client router handles dynamic paths.
# SPA CSP is embedded per HTML document (meta) so hashes cannot desync from
# SPA heal/rebuild. Do NOT add_header a hash CSP here — a stale nginx header
# intersects with the document policy and blocks Next inline scripts.
location = /machine {
    include /etc/nginx/nginx-edge-security-headers.inc;
    include /etc/nginx/nginx-csp-no-active.inc;
    return 302 /machine/;
}

location ^~ /machine/ {
    root /srv/static/frontend;
    try_files $uri $uri/ /machine/index.html =503;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
    include /etc/nginx/nginx-edge-security-headers.inc;
}

location = /pub {
    include /etc/nginx/nginx-edge-security-headers.inc;
    include /etc/nginx/nginx-csp-no-active.inc;
    return 302 /pub/;
}

location ^~ /pub/ {
    root /srv/static/frontend;
    try_files $uri $uri/ /pub/index.html =503;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
    include /etc/nginx/nginx-edge-security-headers.inc;
}

# Django (Gunicorn): explicit prefixes only (see hpcperfstats_site/urls.py).
# Unknown paths stop here with 404 so probes never reach the app server.
location = / {
    include /etc/nginx/nginx-django-proxy-common.inc;
    include /etc/nginx/nginx-csp-no-active.inc;
    proxy_pass http://django_server;
}

location ^~ /api/ {
    include /etc/nginx/nginx-django-proxy-common.inc;
    include /etc/nginx/nginx-csp-no-active.inc;
    proxy_pass http://django_server;
}

location = /robots.txt {
    alias /srv/static/frontend/robots.txt;
    default_type text/plain;
    add_header Cache-Control "no-store, no-cache" always;
    include /etc/nginx/nginx-edge-security-headers.inc;
    include /etc/nginx/nginx-csp-no-active.inc;
}

location ^~ /csp-report/ {
    include /etc/nginx/nginx-django-proxy-common.inc;
    include /etc/nginx/nginx-csp-no-active.inc;
    proxy_pass http://django_server;
}

location ^~ /api-key/ {
    include /etc/nginx/nginx-django-proxy-common.inc;
    include /etc/nginx/nginx-csp-django-html.inc;
    proxy_pass http://django_server;
}

location ^~ /admin_monitor/ {
    include /etc/nginx/nginx-django-proxy-common.inc;
    include /etc/nginx/nginx-csp-django-html.inc;
    proxy_pass http://django_server;
}

location ^~ /login/ {
    include /etc/nginx/nginx-django-proxy-common.inc;
    include /etc/nginx/nginx-csp-django-html.inc;
    proxy_pass http://django_server;
}

location = /login_prompt {
    include /etc/nginx/nginx-django-proxy-common.inc;
    include /etc/nginx/nginx-csp-django-html.inc;
    proxy_pass http://django_server;
}

location ^~ /logout/ {
    include /etc/nginx/nginx-django-proxy-common.inc;
    include /etc/nginx/nginx-csp-django-html.inc;
    proxy_pass http://django_server;
}

location ^~ /oauth_callback/ {
    include /etc/nginx/nginx-django-proxy-common.inc;
    include /etc/nginx/nginx-csp-django-html.inc;
    proxy_pass http://django_server;
}

location / {
    include /etc/nginx/nginx-edge-security-headers.inc;
    include /etc/nginx/nginx-csp-no-active.inc;
    return 404;
}
