# this file runs all of the services that support the django app and data proccessing
# all app components are in the docker-compose.app.yaml file
# Optional cpuset fragments (default empty services): cpu-pinning.infra + cpu-pinning.app

include:
  - docker-compose.app.yaml
  - docker-compose.cpu-pinning.infra.yaml
  - docker-compose.cpu-pinning.app.yaml

services:
  web:
    volumes:
      - staticfiles_data:/home/hpcperfstats/staticfiles
      - media_data:/home/hpcperfstats/hpcperfstats/site/hpcperfstats_site/media

  redis:
    image: redis:7.4.8-alpine3.21
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "8gb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      hpcperfstats_net:
        aliases:
          - redis

  proxy:
    build:
      context: ./
      dockerfile: services-conf/proxy.Dockerfile
    image: hpcperfstats-proxy
    container_name: hpcperfstats_proxy_1
    restart: always
    depends_on:
      web:
        condition: service_started
    healthcheck:
      # Only validate that nginx is accepting TCP connections.
      # TLS may not be ready yet (certs), and some routes may return 4xx.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - 80:80
      - 443:443
    volumes:
      # Main vhost (TLS paths, listen, includes): host file replaces image-baked default.conf.
      # Create with: cp services-conf/nginx.conf.example services-conf/nginx.conf
      # hps-proxy-allowed-hosts.inc stays image-baked from INI at build unless you rebuild proxy.
      - ./services-conf/nginx.conf:/etc/nginx/http.d/default.conf:ro
      - ./services-conf/nginx-static-files.conf:/etc/nginx/nginx-static-files.conf:ro
      - ./services-conf/nginx-django-proxy-common.inc:/etc/nginx/nginx-django-proxy-common.inc:ro
      - ./services-conf/nginx-edge-security-headers.inc:/etc/nginx/nginx-edge-security-headers.inc:ro
      - /etc/letsencrypt/:/etc/letsencrypt/:ro
      - staticfiles_data:/srv/static:ro
      - media_data:/srv/media:ro
    networks:
      hpcperfstats_net:
        aliases:
          - proxy

  db:
    image: timescale/timescaledb:2.27.0-pg15
    container_name: hpcperfstats_db_1
    # Default container /dev/shm is 64MiB; Postgres dynamic shared memory exhausts it easily
    # under parallel workers. Keep shm_size generous for max_connections=500 + modest parallelism.
    #
    # Memory / connection budget (operator): max_connections=500 is headroom for many Django
    # workers + threads + pipeline pools, not permission to run 500 heavy queries at once.
    # Spike control: lower work_mem and parallel gather workers cap per-query RAM; slightly lower
    # shared_buffers frees container RAM for backends + OS cache (see README Postgres section).
    #
    # statement_timeout / idle_in_transaction_session_timeout: align with Django OPTIONS in settings
    # (defaults 120s / 300s in ms). Shed runaway queries; tune bulk jobs if needed.
    # max_wal_size: reduce checkpoint churn under sustained write load.
    command:
      - -c
      - max_connections=500
      - -c
      - statement_timeout=120000
      - -c
      - idle_in_transaction_session_timeout=300000
      - -c
      - shared_buffers=12GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - autovacuum_work_mem=256MB
      - -c
      - temp_buffers=4MB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - min_wal_size=2GB
      - -c
      - max_wal_size=6GB
      - -c
      - max_worker_processes=20
      - -c
      - max_parallel_workers=8
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - max_parallel_maintenance_workers=1
      # Ingest replays and occasional DML on compressed host_data chunks can
      # exceed TimescaleDB's default 100k tuple decompress cap per transaction.
      - -c
      - timescaledb.max_tuples_decompressed_per_dml_transaction=1000000
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U hpcperfstats -h 127.0.0.1 -p 5432",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    stop_signal: SIGINT  # Preferred for faster, yet still graceful, shutdowns
    stop_grace_period: 2m
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=hpcperfstats
      - POSTGRES_PASSWORD=hpcperfstats
    networks:
      hpcperfstats_net:
        aliases:
          - db

  rabbitmq:
    image: rabbitmq:4.3.0-alpine
    container_name: hpcperfstats_rabbitmq_1
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      # `rabbitmq-diagnostics ping` returns non-zero if the node is not ready.
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - 5672:5672
    volumes:
      - rabbitmq_messages:/var/lib/rabbitmq/
      - /var/log/rabbitmq:/var/log/rabbitmq
      - ./services-conf/rabbitmq_logging.conf:/etc/rabbitmq/conf.d/30-logging_settings.conf:ro
      - ./services-conf/rabbitmq_max_message_size.conf:/etc/rabbitmq/conf.d/20-max_message_size.conf:ro
    networks:
      hpcperfstats_net:
        aliases:
          - rabbitmq

volumes:
  staticfiles_data:
  media_data:
  postgres_data:
  rabbitmq_messages:

networks:
  hpcperfstats_net:
    name: hpcperfstats_net

