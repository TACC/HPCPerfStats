# Base stack: infra + web/pipeline definitions.
# Site bind volumes and optional knobs: docker-compose.settings.yaml
# (cp docker-compose.settings.yaml.example docker-compose.settings.yaml).

name: hpcperfstats

include:
  - docker-compose.settings.yaml

# Container stdout/stderr for `docker compose logs` (not host syslog/journald).
# Use json-file (not Docker-only ``local``) so Podman accept the driver too.
# max-size: rotate each file at 100 MiB; max-file: keep this many rotated files
# per container (~300 MiB cap with max-file: "3").
x-logging: &hpc-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "3"

services:
  web:
    build:
      context: ./
      dockerfile: Dockerfile
      target: hpcperfstats-full
      # Optional override for staff SPA commit link. Primary bake uses context .git
      # (frontend-builder COPY + git rev-parse). Default unknown falls back to .git.
      args:
        HPCPERFSTATS_GIT_COMMIT: ${HPCPERFSTATS_GIT_COMMIT:-unknown}
    image: hpcperfstats
    restart: always
    logging: *hpc-logging
    command: /home/hpcperfstats/services-conf/django_startup.sh
    environment:
      - HPCPERFSTATS_INI=/home/hpcperfstats/hpcperfstats.ini
      - STATIC_ROOT=/home/hpcperfstats/staticfiles
    volumes:
      - staticfiles_data:/home/hpcperfstats/staticfiles
      - media_data:/home/hpcperfstats/hpcperfstats/site/hpcperfstats_site/media
      - hpcperfstatsdata:/hpcperfstats/
    networks:
      hpcperfstats_net:
        aliases:
          - web

  pipeline:
    image: hpcperfstats
    restart: always
    logging: *hpc-logging
    # cgroup memory.max for sync_timedb / supervisord (Podman/Docker --memory).
    # Tune from host MemTotal minus db, web, redis; 128g fits ~192 GiB hosts with no swap.
    mem_limit: 128g
    memswap_limit: 128g
    stop_grace_period: ${HPCPERFSTATS_PIPELINE_STOP_GRACE:-2m}
    depends_on:
      - web
    command: /home/hpcperfstats/services-conf/supervisor_startup.sh
    environment:
      - HPCPERFSTATS_INI=/home/hpcperfstats/hpcperfstats.ini
    ports:
      - 514:514/udp
      - 514:514/tcp
    volumes:
      - hpcperfstatsdata:/hpcperfstats/
      - ssh_keys:/hpcperfstats/.ssh/:ro
    networks:
      hpcperfstats_net:
        aliases:
          - pipeline

  redis:
    image: redis:8.10.0-alpine3.23
    logging: *hpc-logging
    command:
      - redis-server
      - --appendonly
      - "no"
      - --maxmemory
      - 16gb
      - --maxmemory-policy
      - volatile-lru
      - --io-threads
      - "4"
      - --io-threads-do-reads
      - "yes"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      hpcperfstats_net:
        aliases:
          - redis

  proxy:
    build:
      context: ./
      dockerfile: services-conf/proxy.Dockerfile
      # Host PEMs from [DEFAULT] ssl_certs_dir via absolute symlinks in
      # .hpcperfstats_ssl_certs/ (not a symlink to LE live/ — those relative
      # archive links break inside the image). Materialize:
      #   python3 services-conf/resolve_proxy_ssl_certs_dir.py
      # Never default to the CI self-signed fixture (HSTS / MOZILLA_PKIX_ERROR_*).
      # CI/Colima: tests/docker-compose.test-overlay.yaml pins ./tests/fixtures/proxy-ssl.
      additional_contexts:
        ssl_certs: ./.hpcperfstats_ssl_certs
    image: hpcperfstats-proxy

    restart: always
    logging: *hpc-logging
    depends_on:
      web:
        condition: service_started
    healthcheck:
      # Only validate that nginx is accepting TCP connections.
      # TLS may not be ready yet (certs), and some routes may return 4xx.
      test:
        - CMD-SHELL
        - nc -z 127.0.0.1 80 || exit 1
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - 80:80
      - 443:443
    volumes:
      # Main vhost (TLS PEMs baked into the proxy image at /etc/ssl/hpcperfstats).
      # Shared routing/security snippets: compose mounts are the only source of truth
      # (proxy.Dockerfile does not COPY these — avoid bake+mount duplication).
      # hps-proxy-allowed-hosts.inc and nginx-resolver.inc stay image/runtime-managed.
      - ./services-conf/nginx.conf:/etc/nginx/http.d/default.conf:ro
      - ./services-conf/nginx-static-files.conf:/etc/nginx/nginx-static-files.conf:ro
      - ./services-conf/nginx-django-proxy-common.inc:/etc/nginx/nginx-django-proxy-common.inc:ro
      - ./services-conf/nginx-edge-security-headers.inc:/etc/nginx/nginx-edge-security-headers.inc:ro
      - ./services-conf/nginx-csp-no-active.inc:/etc/nginx/nginx-csp-no-active.inc:ro
      - ./services-conf/nginx-csp-django-html.inc:/etc/nginx/nginx-csp-django-html.inc:ro
      - staticfiles_data:/srv/static:ro
      - media_data:/srv/media:ro
    networks:
      hpcperfstats_net:
        aliases:
          - proxy

  db:
    image: timescale/timescaledb:2.28.3-pg15
    logging: *hpc-logging
    # Default container /dev/shm is 64MiB; Postgres dynamic shared memory exhausts it easily
    # under parallel workers. Keep shm_size generous for max_connections=500 + modest parallelism.
    #
    # Memory / connection budget (operator): max_connections=500 is headroom for many Django
    # workers + threads + pipeline pools, not permission to run 500 heavy queries at once.
    # Spike control: lower work_mem caps per-query RAM; parallel gather defaults are raised for
    # bulk scans (see max_parallel_* below). Slightly lower shared_buffers frees container RAM
    # for backends + OS cache (see README Postgres section).
    #
    # statement_timeout / idle_in_transaction_session_timeout: align with Django OPTIONS in settings
    # (defaults 120s / 300s in ms). Shed runaway queries; tune bulk jobs if needed.
    # max_wal_size: reduce checkpoint churn under sustained write load.
    shm_size: "16gb"
    command:
      - -c
      - max_connections=500
      - -c
      - statement_timeout=120000
      - -c
      - idle_in_transaction_session_timeout=300000
      - -c
      - shared_buffers=12GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - autovacuum_work_mem=256MB
      - -c
      - temp_buffers=4MB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - min_wal_size=2GB
      - -c
      - max_wal_size=6GB
      - -c
      - max_worker_processes=32
      - -c
      - max_parallel_workers=24
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - max_parallel_maintenance_workers=2
      # Ingest replays and occasional DML on compressed host_data chunks can
      # exceed TimescaleDB's default 100k tuple decompress cap per transaction.
      - -c
      - timescaledb.max_tuples_decompressed_per_dml_transaction=1000000
    restart: always
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U hpcperfstats -h 127.0.0.1 -p 5432
      interval: 5s
      timeout: 3s
      retries: 10
    stop_signal: SIGINT  # Preferred for faster, yet still graceful, shutdowns
    stop_grace_period: 2m
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=hpcperfstats
      - POSTGRES_PASSWORD=hpcperfstats
    networks:
      hpcperfstats_net:
        aliases:
          - db

  rabbitmq:
    # Management plugin (HTTP API on 15672) for Admin Monitor stats.
    image: rabbitmq:4.3.4-management-alpine
    restart: always
    logging: *hpc-logging
    hostname: rabbitmq-prod
    # Pair with services-conf/rabbitmq_vm_memory.conf (80GiB watermark headroom).
    # Without mem_limit, CGROUP_MAX=max and Erlang binary_alloc can OOM the host.
    mem_limit: 96g
    memswap_limit: 96g
    environment:
      - RABBITMQ_NODENAME=rabbit@rabbitmq-prod
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    stop_grace_period: 2m 
    healthcheck:
      # `rabbitmq-diagnostics ping` returns non-zero if the node is not ready.
      test:
        - CMD-SHELL
        - rabbitmq-diagnostics -q ping || exit 1
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - 5672:5672
      # Management HTTP API / UI — keep compose-internal only (Django uses
      # http://rabbitmq:15672). Do not publish 15672 on the host by default;
      # uncomment in docker-compose.settings.yaml if needed.
    volumes:
      - rabbitmq_messages:/var/lib/rabbitmq/
      - ./services-conf/rabbitmq_logging.conf:/etc/rabbitmq/conf.d/30-logging_settings.conf:ro
      - ./services-conf/rabbitmq_max_message_size.conf:/etc/rabbitmq/conf.d/20-max_message_size.conf:ro
      - ./services-conf/rabbitmq_default_queue_type.conf:/etc/rabbitmq/conf.d/25-default_queue_type.conf:ro
      - ./services-conf/rabbitmq_vm_memory.conf:/etc/rabbitmq/conf.d/35-vm_memory.conf:ro
      - ./services-conf/rabbitmq_management.conf:/etc/rabbitmq/conf.d/40-management.conf:ro
    networks:
      hpcperfstats_net:
        aliases:
          - rabbitmq


networks:
  hpcperfstats_net:
    name: hpcperfstats_net
