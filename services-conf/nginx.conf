# Proxy TLS front door (PEMs materialized at container start into /etc/ssl/hpcperfstats).
#
# Allowed Host names come from /etc/nginx/hps-proxy-allowed-hosts.inc (generated from
# [DEFAULT] server= in hpcperfstats.ini — see parse_hpcperfstats_proxy_hosts.py).
#
# TLS PEMs are copied from proxy_ssl_source:/mnt/ssl-source at container start
# (see resolve_proxy_ssl_certs_dir.py in proxy_entrypoint.sh). Do not put site hostnames here.

upstream django_server {
    server web:8000;
    keepalive 64;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}

server {
    listen 80;
    listen [::]:80;
    include /etc/nginx/hps-proxy-allowed-hosts.inc;
    # Preserve the request Host when upgrading (included snippet defines server_name).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        include /etc/nginx/hps-proxy-allowed-hosts.inc;

        server_tokens off;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Compression: enable gzip for typical text payloads.
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_min_length 256;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/json
            application/javascript
            application/xml
            application/rss+xml
            image/svg+xml;
        # Prefer Brotli for modern clients; keep gzip as fallback.
        brotli on;
        brotli_comp_level 5;
        brotli_min_length 256;
        brotli_static off;
        brotli_window 512k;
        brotli_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/json
            application/javascript
            application/xml
            application/rss+xml
            image/svg+xml;

        # Allow large sacct ingest payloads from hpcperfstats-sacct-gen.
        client_max_body_size 64M;

        # Allocate a massive memory buffer so 64MB payloads stay in RAM instead of hitting disk
        # which is slow.
        client_body_buffer_size 64M;



        ssl_protocols TLSv1.2 TLSv1.3;
        # OCSP stapling: requires ssl_trusted_certificate (CA bundle) and a resolver
        # include generated at container start from /etc/resolv.conf. Certificates without
        # an AIA OCSP URL (many modern Let's Encrypt leafs) will not staple; that must not
        # take the site offline. Merge these directives into deployment-local nginx.conf.
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        include /etc/nginx/nginx-resolver.inc;

        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;

        ssl_certificate /etc/ssl/hpcperfstats/fullchain.pem;
        ssl_certificate_key /etc/ssl/hpcperfstats/privkey.pem;

        include /etc/nginx/nginx-static-files.conf;
}
