  /api/pub/cluster-dashboard/:
    get:
      operationId: pub_cluster_dashboard_retrieve
      description: 'Public cluster dashboard: meta by default; lazy period or full
        bundle via query params.'
      parameters:
      - in: query
        name: full
        schema:
          type: integer
        description: 1 to return legacy full bundle
      - in: query
        name: grouping
        schema:
          type: string
      - in: query
        name: period
        schema:
          type: string
      - in: query
        name: section
        schema:
          type: string
        description: Lazy section (expansion_factor)
      tags:
      - public
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicClusterDashboard'
          description: ''
  /api/sacct/ingest/:
    post:
      operationId: sacct_ingest_create
      description: |-
        Ingest pipe-delimited sacct output into job_data using sync_acct logic.

        Requires authentication (API key or session) and staff. Request body must be
        raw pipe-delimited sacct output (same format as sacct -P -o ...). Query
        param date=YYYY-MM-DD is required (the date of the data being ingested) to
        compute which jobs are already in the DB.
      parameters:
      - in: query
        name: date
        schema:
          type: string
      tags:
      - admin
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SacctIngestResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '403':
