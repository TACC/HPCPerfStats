name: security-audit

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "hpcperfstats/site/frontend/package*.json"
      - "docker-compose.yaml"
      - "Dockerfile"
      - "tests/run_security_audit_workflow.sh"
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build web image for production-context pip-audit
        run: docker-compose build web

      - name: Run security audits
        run: tests/run_security_audit_workflow.sh
