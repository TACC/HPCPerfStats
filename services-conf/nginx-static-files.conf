location /static/ {
    alias /srv/static/;
    try_files $uri =404;
    access_log off;
    log_not_found off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
}

location /media/ {
    alias /srv/media/;
    try_files $uri =404;
    log_not_found off;
    expires off;
    add_header Cache-Control "public, max-age=0";
}
