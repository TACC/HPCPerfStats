# Compose overlay for local/CI test workflows (tests/run_*_workflow.sh).
#
# Replaces the production hpcperfstatsdata bind mount (/opt/hpcperfstats_data on the
# host) with a named Docker volume so macOS/Colima dev machines do not need sudo
# paths under /opt. Production operators still use docker-compose.app.yaml as copied
# from docker-compose.app.yaml.example.
services:
  web:
    volumes:
      - test_hpcperfstatsdata:/hpcperfstats/
  pipeline:
    volumes:
      - test_hpcperfstatsdata:/hpcperfstats/

volumes:
  test_hpcperfstatsdata:
