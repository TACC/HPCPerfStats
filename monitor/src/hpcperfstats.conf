#
# hpcperfstatsd configuration
#
# Format:
#   key value
# Key/value separators can be whitespace, ':', or '='.
# Blank lines are ignored.
#
# Exhaustive list of supported keys (read by hpcperfstatsd):
#   - server
#   - queue
#   - port
#   - user
#   - password
#   - buffer_hours
#   - sample_freq
#   - sample_freq_slow
#   - send_freq
#   - enable_slow_tier
#   - freq (deprecated alias for sample_freq)
#   - jobid_file
#

# server: RabbitMQ host or IP used for publishing monitor messages.
server localhost

# queue: RabbitMQ queue name used by the monitor publisher.
queue  default

# port: RabbitMQ TCP port.
port   5672

# user: RabbitMQ username for authentication.
user guest

# password: RabbitMQ password for authentication.
password guest

# buffer_hours: Number of hours to keep in-memory unsent samples when dynamic
# sizing is active (i.e., no explicit `buffer` override from config/CLI).
# Capacity is computed as ceil((buffer_hours * 3600) / sample_freq).
# Approximate memory: about 8 KiB per buffered sample (payload-dependent).
# Example (6h at sample_freq=30s): ceil(21600/30)=720 samples,
# about 720 * 8 KiB ~= 5.6 MiB of RAM.
buffer_hours 6

# sample_freq: Fast-tier sampling interval in seconds (performance metrics).
sample_freq 30

# sample_freq_slow: Slow-tier sampling interval in seconds. Every
# sample_freq_slow seconds a full sample (fast + slow keys) is taken; in
# between, only fast-tier keys are collected. Must be >= sample_freq.
# Only takes effect when enable_slow_tier is 1.
sample_freq_slow 600

# send_freq: RabbitMQ send interval in seconds.
send_freq   300

# enable_slow_tier: 1 (default) enables two-tier collection: fast keys every
# sample_freq, all keys every sample_freq_slow, with sparse `@fast`/`@full`
# sample rows. Set to 0 for legacy single-tier behavior (every key collected and
# emitted full-width every sample_freq). NOTE: sparse rows require an updated
# downstream consumer; see the monitor README archive-format notes.
enable_slow_tier 1

# jobid_file: Path to the file containing the active job id token.
jobid_file /var/run/stats_jobid
