  /api/jobs/histograms/batch/:
    get:
      operationId: jobs_histograms_batch_retrieve
      description: |-
        Return multiple metric histograms in one response (single dataframe build).

        Query param ``metrics`` is comma-separated (default: runtime,nhosts,queue_wait).
      parameters:
      - in: query
        name: metrics
        schema:
          type: string
        description: 'Comma-separated metric names (default: runtime,nhosts,queue_wait)'
      tags:
      - jobs
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListHistogramBatchResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Not found
        '409':
