          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Conflict
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Payload too large
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Too many requests
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Server error
  /api/jobs/{id}/plots/:
    get:
      operationId: jobs_plots_retrieve
      description: |-
        Job-level plots grouped by shared jid_table input.

        Returns Bokeh json_items and availability reasons for:
        - Summary plot
        - Roofline
        - GPU roofline

        Query params:
        - plot: omit or ``all`` for all three; or one of summary_plot, roofline, gpu_roofline.
        - zoom: ``1`` for zoom layout (single-plot requests only).
        - progressive: ``1`` with plot=all (no zoom): HTTP 200 with ``status`` partial/ready and
          only completed plot fields included while others are listed in ``loading_plots``;
          avoids 202 while still using one endpoint and shared background tasks.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: query
        name: plot
        schema:
          type: string
      - in: query
        name: progressive
        schema:
          type: string
      - in: query
        name: zoom
        schema:
          type: string
      tags:
      - jobs
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPlotsResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Conflict
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Payload too large
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Too many requests
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Server error
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPlotsResponse'
          description: Plots still generating; retry after retry_after_seconds
  /api/jobs/histograms/:
    get:
      operationId: jobs_histograms_retrieve
      description: |-
        Return Bokeh histograms for the job list, loaded incrementally.

        This endpoint supports per-plot loading for metric histograms. The caller
        must provide a 'group' query parameter:

        - group=metric&metric=<name>: return a single metric histogram (thumb and
          full) for the given metric name.

        Example:
          /api/jobs/histograms/?end_time__date=2024-01-01&group=metric&metric=runtime
      parameters:
      - in: query
        name: group
        schema:
          type: string
        required: true
      - in: query
        name: metric
        schema:
          type: string
      tags:
      - jobs
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListHistogramResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Conflict
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Payload too large
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Too many requests
        '500':
