          description: Too many requests
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Server error
  /api/jobs/{id}/:
    get:
      operationId: jobs_retrieve_2
      description: 'Single job detail: metadata, host_list, fsio, xalt, schema, URLs
        (plots via separate job_plots endpoint).'
      parameters:
      - in: query
        name: defer
        schema:
          type: string
        description: 'Comma-separated: xalt, proc, multiprecision'
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: query
        name: light
        schema:
          type: integer
      tags:
      - jobs
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetailResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
