# Local git hooks for lint gates (install: scripts/install-git-hooks.sh).
default_language_version:
  python: python3.14

repos:
  - repo: local
    hooks:
      - id: python-def-inventory-check
        name: python def docstring/hint inventory (--check)
        entry: bash -c '../.venv/bin/python3 scripts/python_def_inventory.py --check'
        language: system
        files: ^(hpcperfstats/|scripts/|services-conf/).*\.py$
        pass_filenames: false

  # cursor-hooks/hpc_claude_hooks.py is a byte copy of the workspace Claude
  # hook, run by the system python3; py314 ruff fixes would break it there.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (staged Python, pyproject policy)
        entry: bash -c '../.venv/bin/ruff check --fix "$@"' --
        language: system
        files: ^(hpcperfstats/|cursor-hooks/|scripts/|services-conf/|hpcperfstats-tools/).*\.py$
        exclude: (^|/)migrations/|^cursor-hooks/hpc_claude_hooks\.py$
        pass_filenames: true

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (staged Python)
        entry: bash -c '../.venv/bin/ruff format "$@"' --
        language: system
        files: ^(hpcperfstats/|cursor-hooks/|scripts/|services-conf/|hpcperfstats-tools/).*\.py$
        exclude: (^|/)migrations/|^cursor-hooks/hpc_claude_hooks\.py$
        pass_filenames: true

  # Shell scripts (by extension or shebang); policy in .shellcheckrc. The
  # shellcheck-py mirror bundles the binary, so every host runs the same version.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: frontend-eslint
        name: frontend eslint (staged)
        # GUI git / Cursor often omit Homebrew from PATH; prefer explicit npm.
        entry: >-
          bash -c 'export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH";
          cd hpcperfstats/site/frontend && npm run lint -- --max-warnings=0'
        language: system
        files: ^hpcperfstats/site/frontend/.*\.(ts|tsx)$
        pass_filenames: false

  - repo: local
    hooks:
      - id: python-memory-leak-check
        name: python memory-leak smoke (memray curated workloads)
        entry: ../.venv/bin/python3 scripts/run_commit_memory_leak_check.py
        language: system
        files: ^(hpcperfstats/|scripts/).*\.py$
        pass_filenames: false

  - repo: local
    hooks:
      - id: frontend-pre-push
        name: frontend typecheck + knip (pre-push)
        entry: >-
          bash -c 'export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH";
          cd hpcperfstats/site/frontend && npm run typecheck && npm run lint:dead'
        language: system
        stages: [pre-push]
        pass_filenames: false

  # Monitor C: -Wall -Wextra -Werror build (monitor/scripts/run_warning_gate.sh).
  # SKIPS (exit 0 with a bold banner) on hosts without Linux/gcc/autoreconf or the
  # static prefix <workspace>/.build/prefix-static -- e.g. macOS checkouts and fresh
  # clones -- so those commits are NOT warning-checked. Pre-push without clang, ld.lld or
  # the aarch64 sysroot/prefix still runs the x86 variants and skips only the aarch64 and
  # unreachable-function checks (same banner). HPC_WARN_GATE_REQUIRE=1 fails instead.
  # verbose: true keeps the banner visible even when the hook passes.
  - repo: local
    hooks:
      - id: monitor-warning-gate
        name: monitor C -Wall -Wextra -Werror (daemon)
        entry: monitor/scripts/run_warning_gate.sh --commit
        language: system
        files: ^monitor/((src|tests)/.*\.[ch]|configure\.ac|(.*/)?Makefile\.am|scripts/run_warning_gate\.sh)$
        pass_filenames: false
        verbose: true
      - id: monitor-warning-gate-push
        name: monitor C warnings (x86 default + DEBUG/shared-node + aarch64) + unreachable functions (pre-push)
        entry: monitor/scripts/run_warning_gate.sh --push
        language: system
        stages: [pre-push]
        files: ^monitor/((src|tests)/.*\.[ch]|configure\.ac|(.*/)?Makefile\.am|scripts/(run_warning_gate\.sh|unreachable_functions\.allowlist))$
        pass_filenames: false
        verbose: true
      # A failed read in a collector must emit a value sentinel, not 0 or a silent skip
      # (monitor/cursor-rules/monitor-value-sentinel-contract.mdc).
      - id: monitor-sentinel-error-paths
        name: monitor collector failed reads emit value sentinels
        entry: bash -c 'exec "$(cd .. && pwd -P)/.venv/bin/python3" -I monitor/scripts/check_sentinel_error_paths.py monitor/src'
        language: system
        files: ^monitor/(src/.*\.c|scripts/check_sentinel_error_paths\.(py|allowlist))$
        pass_filenames: false

  # Markdown lint (docs/reference/documentation-style.md, "Lint toolchain").
  # files: is a ratchet: it lists the evergreen pages that follow the style
  # guide and widens as pages migrate. The anchors keep the four hooks on one
  # scope. Records (docs/history/, docs/measurements/), generated docs (lint
  # their generator instead), node_modules and test_runs are excluded.
  - repo: local
    hooks:
      - id: mdformat
        name: mdformat (staged Markdown, .mdformat.toml)
        entry: bash -c '../.venv/bin/mdformat "$@"' --
        language: system
        files: &md_lint_files ^(README\.md|docs/reference/documentation-style\.md|docs/index\.md|docs/tutorials/install-hpcperfstats\.md|docs/reference/(compose-services|pipeline-configuration)\.md|docs/explanation/(architecture|pipeline-concurrency)\.md|docs/how-to/develop/(run-tests|run-sync-timedb-benchmarks|diagnose-update-metrics)\.md|docs/reference/(test-layout|release-notes)\.md|docs/how-to/operate/(upgrade-the-stack|recover-rabbitmq|migrate-to-postgresql-18|verify-sync-timedb)\.md|docs/reference/sync-timedb-stall-signatures\.md)$
        exclude: &md_lint_exclude ^(docs/history/|docs/measurements/|test_runs/|docs/MONITOR_VARIABLES\.md$|monitor/docs/METRICS_REFERENCE\.md$)|(^|/)node_modules/
        pass_filenames: true
      - id: pymarkdown
        name: pymarkdown scan (staged Markdown, .pymarkdown.json)
        entry: bash -c '../.venv/bin/pymarkdown --config .pymarkdown.json scan "$@"' --
        language: system
        files: *md_lint_files
        exclude: *md_lint_exclude
        pass_filenames: true
      # The vale pip wrapper downloads the binary from GitHub on its first run;
      # offline, that run fails, so say how to recover instead of a traceback.
      - id: vale
        name: vale prose lint (staged Markdown, .vale.ini, local HPC style)
        entry: >-
          bash -c '../.venv/bin/vale --version >/dev/null 2>&1 || {
          echo "vale: binary missing and the one-time download failed;" >&2;
          echo "run ../.venv/bin/vale --version once while online" >&2;
          echo "(docs/reference/documentation-style.md, Vale first run)" >&2;
          exit 1; }; exec ../.venv/bin/vale --config .vale.ini "$@"' --
        language: system
        files: *md_lint_files
        exclude: *md_lint_exclude
        pass_filenames: true
      - id: codespell
        name: codespell (staged Markdown, .codespellrc)
        entry: bash -c '../.venv/bin/codespell "$@"' --
        language: system
        files: *md_lint_files
        exclude: *md_lint_exclude
        pass_filenames: true

  - repo: local
    hooks:
      - id: vulture-pre-push
        name: vulture dead code (pre-push)
        entry: bash -c '../.venv/bin/vulture hpcperfstats scripts/vulture_whitelist.py --min-confidence 80'
        language: system
        stages: [pre-push]
        pass_filenames: false
