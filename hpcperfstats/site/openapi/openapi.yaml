openapi: 3.0.3
info:
  title: HPCPerfStats API
  version: '3.0'
  description: REST API for the HPCPerfStats machine SPA and public dashboards.
paths:
  /api/admin_monitor/:
    get:
      operationId: admin_monitor_retrieve
      description: |-
        Staff-only: HPCPerfStats Monitor data (host timestamps, cache/Redis, RabbitMQ, TimescaleDB stats).

        Supports a lightweight, per-section API via the optional 'section' query
        param:
        - ?section=hosts      -> {"host_stats": [...]}
        - ?section=rabbitmq_hosts -> {"rabbitmq_host_stats": [...]}
        - ?section=cache      -> {"cache_stats": {...}}
        - ?section=rabbitmq   -> {"rabbitmq_stats": {...}}
        - ?section=timescaledb -> {"timescaledb_stats": {...}}
        - ?section=xalt      -> {"xalt_stats": {...}}
        - omitted/other       -> {"host_stats": [...], "rabbitmq_host_stats": [...],
                                  "cache_stats": {...}, "rabbitmq_stats": {...},
                                  "timescaledb_stats": {...}, "xalt_stats": {...}}
      parameters:
      - in: query
        name: refresh
        schema:
          type: string
      - in: query
        name: section
        schema:
          type: string
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMonitorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Conflict
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Payload too large
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Too many requests
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Server error
  /api/cache/invalidate-page/:
    post:
      operationId: cache_invalidate_page_create
      description: |-
        Invalidate cache entries associated with the provided page path.

        Deletes Django ``@cache_page`` / ``dynamic_cache_page`` rows via ``cache.delete``
        (correct key prefix/versioning), then raw Redis ``SCAN`` for keys whose names
        embed the same URL MD5 as Django's cache layer (covers ``Vary`` variants).

        For any ``/machine`` or ``/machine/...`` path, also targets ``/api/home/`` and
        drops ``home_options`` ORM cache keys (dates, metrics list, queues, states,
        site newest job end). Works without a raw Redis client (LocMem): ORM + Django
        cache deletes still run.
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvalidateCacheRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvalidateCacheRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvalidateCacheRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidateCacheResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Forbidden
  /api/home/:
    get:
      operationId: home_retrieve
      description: 'Return options for search form: date_list, metrics, queues, states,
        machine_name.'
      tags:
      - home
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeOptions'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Forbidden
  /api/host_plot/:
    get:
      operationId: host_plot_retrieve
      description: Return Bokeh plot_item for a single host and time range (GET host,
        end_time__gte, end_time__lte).
      summary: Host utilization plot
      parameters:
      - in: query
        name: end_time__gte
        schema:
          type: string
        required: true
      - in: query
        name: end_time__lte
        schema:
          type: string
      - in: query
        name: host
        schema:
          type: string
        required: true
      tags:
      - hosts
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostPlotResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Forbidden
  /api/job_monitor/:
    get:
      operationId: job_monitor_retrieve
      description: |-
        Staff-only: aggregate job failure statistics per user over a recent window.

        The window is controlled by the optional ?days=N query parameter (integer).
        N is clamped to [1, 365]. If missing or invalid, defaults to 30 days.

        Returns rows of:
        - username
        - total_jobs: number of jobs run
        - failed_jobs: number of jobs with state OUT_OF_MEMORY or FAILED
        - failed_rate: percentage of failed jobs (0–100), sorted descending.
        GPU fields are intentionally omitted from this initial endpoint so the page
        can render quickly; per-user GPU stats are fetched asynchronously from
        job_monitor_gpu_for_user.
      parameters:
      - in: query
        name: days
        schema:
          type: integer
      tags:
      - monitor
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobMonitorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Forbidden
  /api/job_monitor/gpu/:
    get:
      operationId: job_monitor_gpu_retrieve
      description: Staff-only GPU rollup for Job Monitor (single ``username`` or batch
        ``usernames``).
      parameters:
      - in: query
        name: days
        schema:
          type: integer
      - in: query
        name: username
        schema:
          type: string
      - in: query
        name: usernames
        schema:
          type: string
        description: Comma-separated usernames for batch GPU rollup
      tags:
      - monitor
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobMonitorGpuResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Forbidden
  /api/jobs/:
    get:
      operationId: jobs_retrieve
      description: Paginated job list only (histograms via separate job_list_histograms
        endpoint).
      parameters:
      - in: query
        name: account
        schema:
          type: string
        description: Comma-separated project/account names (exact match, OR).
      - in: query
        name: end_time__date
        schema:
          type: string
      - in: query
        name: host
        schema:
          type: string
      - in: query
        name: order_by
        schema:
          type: string
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: performance_sort_rank
        schema:
          type: string
        description: Comma-separated performance status ranks 0–5 (OR).
      - in: query
        name: queue
        schema:
          type: string
        description: Comma-separated queue names (OR).
      - in: query
        name: state
        schema:
          type: string
        description: 'Comma-separated major terminal status group keys (OR): completed, failed, canceled, preempted.'
      - in: query
        name: username
        schema:
          type: string
        description: Comma-separated usernames (OR within dimension).
      tags:
      - jobs
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Conflict
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Payload too large
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Too many requests
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: Server error
