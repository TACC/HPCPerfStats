# Vale config for the Markdown lint hook. Styles are vendored under
# .vale/styles/ (no vale sync); see docs/reference/documentation-style.md.
StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = HPC
# Published paper titles are quoted verbatim, so the P9 word list does not
# apply to them. One exact title per entry; never a pattern.
TokenIgnores = (Comprehensive Resource Use Monitoring for HPC Systems with TACC Stats)
