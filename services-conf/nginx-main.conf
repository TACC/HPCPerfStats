# Main nginx process / http defaults for the Compose proxy image.
# Vhost (server blocks) lives in http.d/default.conf (services-conf/nginx.conf).
# Shared snippets remain compose bind-mounts only.

user nginx;

# Match visible CPUs (cgroup / host); never hardcode a core count.
worker_processes auto;
worker_cpu_affinity auto;

# JIT for regex locations (allowlist / static deny patterns).
pcre_jit on;

error_log /var/log/nginx/error.log warn;
pid /run/nginx/nginx.pid;

worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;

    # Helps hashed /static/ reuse. SPA shells under /machine/ and /pub/ set
    # open_file_cache off so heal/os.replace is not served from a stale fd.
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Session tickets are insecure when shared across workers without rotation.
    ssl_session_tickets off;

    # Third-party compressors (ngx_brotli, zstd-nginx-module, gzip_static) are
    # compiled into nginx in proxy.Dockerfile (--add-module / --with-http_gzip_static_module).
    # Do not load_module here. Locations opt in via nginx-compress-*.inc.
    gzip off;
    brotli off;
    zstd off;
    gzip_vary on;
    gzip_min_length 256;
    brotli_min_length 256;
    zstd_min_length 256;
    gzip_buffers 16 8k;
    brotli_buffers 16 8k;
    zstd_buffers 16 8k;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/xhtml+xml
        image/svg+xml;
    brotli_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/xhtml+xml
        image/svg+xml;
    zstd_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/xhtml+xml
        image/svg+xml;

    include /etc/nginx/http.d/*.conf;
}
