[supervisord]
nodaemon=true
logfile=/dev/fd/1
logfile_maxbytes=0

[program:hpcperfstats-rabbitmq-listener]
command=/opt/python3.14t/bin/python /home/hpcperfstats/hpcperfstats/listend.py
user=hpcperfstats
environment=HOME="/home/hpcperfstats",USER="hpcperfstats"
priority=10
autorestart=true
startretries=20
; Wait past sync_timedb SHUTDOWN_DRAIN_TIMEOUT_S (120s) so Docker/supervisor SIGKILL
; does not undercut cooperative drain on sibling programs during container stop.
stopwaitsecs=130
stdout_redirect=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_redirect=true
stderr_logfile=/dev/fd/1
stderr_logfile_maxbytes=0

# WARNING: Site rsync_data.sh must be updated with your specific rsync commands.
# Default committed scripts sleep 12h then exit ("rsync not yet configured").
# To enable: remove the three-line guard at the top of rsync_data.sh and put
# sleep 43200 at the end of the while true loop. Requires ssh keys in compose.
#
# supervisord always runs the wrapper; it prefers rsync_data.sh, else
# rsync_data.sh.example (both guarded until edited).
[program:rsync_data]
command=/home/hpcperfstats/services-conf/rsync_data_wrapper.sh
user=hpcperfstats
environment=HOME="/home/hpcperfstats",USER="hpcperfstats"
autorestart=true
stdout_redirect=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_redirect=true
stderr_logfile=/dev/fd/1
stderr_logfile_maxbytes=0

# DB-heavy programs are staggered so restart does not open all pools at once.
# Lower priority number = supervisord starts earlier. Delays are wall-clock after shell starts.
# Pipeline ABI is baked /opt/python3.14t (free-threaded); web/helpers stay /usr/local/bin/python3.
[program:sync_timedb]
command=bash -lc 'sleep 20; exec /opt/python3.14t/bin/python /home/hpcperfstats/hpcperfstats/dbload/sync_timedb.py'
user=hpcperfstats
environment=HOME="/home/hpcperfstats",USER="hpcperfstats"
priority=20
autorestart=true
startretries=20
; Must be >= SHUTDOWN_DRAIN_TIMEOUT_S (120). Default supervisord stopwaitsecs is 10.
stopwaitsecs=130
stopasgroup=true
killasgroup=true
stdout_redirect=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_redirect=true
stderr_logfile=/dev/fd/1
stderr_logfile_maxbytes=0

[program:update_metrics]
command=bash -lc 'sleep 90; exec /opt/python3.14t/bin/python /home/hpcperfstats/hpcperfstats/analysis/metrics/update_metrics.py'
user=hpcperfstats
environment=HOME="/home/hpcperfstats",USER="hpcperfstats"
priority=30
autorestart=true
startretries=20
; Align with pipeline stopwaitsecs so container stop does not SIGKILL early.
stopwaitsecs=130
stdout_redirect=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_redirect=true
stderr_logfile=/dev/fd/1
stderr_logfile_maxbytes=0

[program:syslog-ng]
command=bash -lc '/usr/local/bin/python3 -m hpcperfstats.render_syslog_ng_generated && exec /usr/sbin/syslog-ng -F --no-caps -f /home/hpcperfstats/services-conf/syslog-ng.conf'
user=root
autorestart=true
startretries=20
stdout_redirect=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_redirect=true
stderr_logfile=/dev/fd/1
stderr_logfile_maxbytes=0

[program:seal_syslog_daily]
command=/usr/local/bin/python3 -m hpcperfstats.seal_syslog_daily
user=hpcperfstats
environment=HOME="/home/hpcperfstats",USER="hpcperfstats"
autorestart=true
startretries=20
stdout_redirect=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_redirect=true
stderr_logfile=/dev/fd/1
stderr_logfile_maxbytes=0
