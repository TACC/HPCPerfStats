#
# hpcperfstatsd configuration
#
# Format:
#   key value
# Key/value separators can be whitespace, ':', or '='.
# Blank lines are ignored.
#
# Exhaustive list of supported keys (read by hpcperfstatsd):
#   - server
#   - queue
#   - port
#   - user
#   - password
#   - buffer_hours
#   - sample_freq
#   - send_freq
#   - freq (deprecated alias for sample_freq)
#   - jobid_file
#

# server: RabbitMQ host or IP used for publishing monitor messages.
server localhost

# queue: RabbitMQ queue name used by the monitor publisher.
queue  default

# port: RabbitMQ TCP port.
port   5672

# user: RabbitMQ username for authentication.
user guest

# password: RabbitMQ password for authentication.
password guest

# buffer_hours: Number of hours to keep in-memory unsent samples when dynamic
# sizing is active (i.e., no explicit `buffer` override from config/CLI).
# Capacity is computed as ceil((buffer_hours * 3600) / sample_freq).
# Approximate memory: about 8 KiB per buffered sample (payload-dependent).
# Example (6h at sample_freq=300s): ceil(21600/300)=72 samples,
# about 72 * 8 KiB ~= 576 KiB of RAM.
buffer_hours 6

# sample_freq: Sampling interval in seconds while a job is active.
sample_freq 300

# send_freq: RabbitMQ send interval in seconds.
send_freq   300

# jobid_file: Path to the file containing the active job id token.
jobid_file /var/run/stats_jobid
