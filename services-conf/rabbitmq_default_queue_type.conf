# Monitor → listend AMQP and Admin Monitor expect durable ingest queues.
# Classic queues OOM under thousands of hpcperfstatsd publisher connections;
# keep the vhost default as quorum (RabbitMQ 4.x). listend / listend_drain must
# declare with arguments x-queue-type=quorum on non-passive declares. Changing
# this file does not convert existing queues — do not delete/recreate stampede3
# (or other machine queues) as classic to "fix" 541 consume timeouts.
default_queue_type = quorum
