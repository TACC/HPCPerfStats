[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpcperfstats-tools"
version = "0.2.0"
description = "Command-line tools for querying an HPCPerfStats deployment"
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [
  { name = "Texas Advanced Computing Center", email = "sharrell@tacc.utexas.edu" },
]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Lesser General Public License v2.1 (LGPLv2.1)",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "requests>=2.34.2",
  "python-dateutil==2.9.0.post0",
  "pandas==3.0.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
]

[project.scripts]
hpcperfstats-jobstats = "hpcperfstats_tools.jobstats_cli:main"
hpcperfstats-sacct-gen = "hpcperfstats_tools.sacct_gen:main"

[tool.setuptools]
packages = ["hpcperfstats_tools"]

[tool.ruff]
target-version = "py314"
line-length = 80  # align with main HPCPerfStats package (Google style)
extend-exclude = [
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "W",
  "B",
  "UP",
  "SIM",
  "RUF",
  "C4",
  "PIE",
  "PGH",
]
ignore = ["E501"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["hpcperfstats_tools"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

