# PostgreSQL client authentication for the compose `db` service.
# Mounted read-only and selected with `-c hba_file=...` (docker-compose.defaults.yaml),
# so it applies to fresh and existing data dirs alike; $PGDATA/pg_hba.conf is ignored.
#
# web/pipeline reach Postgres over the Unix socket on the shared postgres_runtime
# tmpfs (/run/postgresql). Those socket logins use scram-sha-256, the same method as
# the network rule below; the image default for `local` is `trust` (no password).
# Loopback stays `trust` as in the image default: only processes inside the db
# container (healthcheck, `exec db psql -h localhost`) reach 127.0.0.1 / ::1.

# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     scram-sha-256
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     scram-sha-256
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    all             all             all                     scram-sha-256
